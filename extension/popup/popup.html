<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Authenticator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logo">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <div>
      <div class="header-title">Domain Authenticator</div>
      <div class="header-domain" id="domain-name">Loading…</div>
    </div>
  </header>

  <!-- Loading -->
  <div id="state-loading" class="state">
    <div class="spinner"></div>
    <p>Analyzing domain at the edge…</p>
  </div>

  <!-- Error -->
  <div id="state-error" class="state hidden">
    <p id="error-msg" class="error-text">Could not analyze this domain.</p>
    <button id="retry-btn" class="btn btn-secondary">Retry</button>
  </div>

  <!-- Results -->
  <div id="state-results" class="hidden">

    <!-- Trust gauge + action -->
    <div id="gauge-section">
      <div class="gauge">
        <svg viewBox="0 0 120 120" class="gauge-svg">
          <circle cx="60" cy="60" r="52" class="gauge-bg"/>
          <circle cx="60" cy="60" r="52" class="gauge-fill" id="gauge-fill"/>
        </svg>
        <div class="gauge-inner">
          <span class="gauge-score" id="trust-score">—</span>
          <span class="gauge-label">trust</span>
        </div>
      </div>
      <div id="verdict-badge" class="verdict-badge">—</div>
      <div id="action-badge" class="action-badge">—</div>
    </div>

    <!-- AI Summary -->
    <div id="ai-summary-section" class="section">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>AI analysis</span>
      </div>
      <p id="ai-summary" class="ai-summary-text"></p>
      <p id="ai-technical" class="ai-technical-text"></p>
      <div id="ai-flags" class="flags-row"></div>
      <div id="ai-safe-reasons" class="safe-row"></div>
    </div>

    <!-- Signal breakdown -->
    <div id="signals-section" class="section">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Signal breakdown</span>
      </div>
      <div id="signals"></div>
    </div>

    <!-- Community votes -->
    <div id="community-section" class="section">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Community verdict</span>
      </div>
      <div id="vote-bars"></div>
      <div class="vote-buttons">
        <button class="vote-btn vote-safe" data-vote="safe">Safe</button>
        <button class="vote-btn vote-suspicious" data-vote="suspicious">Suspicious</button>
        <button class="vote-btn vote-unsafe" data-vote="unsafe">Unsafe</button>
      </div>
      <div id="vote-feedback" class="vote-feedback hidden"></div>
    </div>

    <!-- Report AI mistake -->
    <div id="report-section" class="section">
      <button id="report-btn" class="btn btn-ghost">Report AI mistake</button>
      <div id="report-form" class="hidden">
        <select id="report-expected" class="select">
          <option value="">What should the verdict be?</option>
          <option value="safe">This site is safe</option>
          <option value="suspicious">This site is suspicious</option>
          <option value="dangerous">This site is dangerous</option>
        </select>
        <input id="report-comment" class="input" placeholder="Optional: why do you think the AI is wrong?" />
        <button id="report-submit" class="btn btn-secondary">Submit report</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Powered by Cloudflare Workers AI · Edge analyzed
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
